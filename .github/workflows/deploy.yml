name: Deploy to Cloudflare

on:
  push:
    branches:
      - master

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Deploy to Cloudflare Pages (throwmyfile.com)
        run: npx wrangler pages deploy client/build --project-name throwmyfile-frontend --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8846c8d2c9e982da3cee1c655ff8cb7c

  deploy-backend:
    name: Deploy Backend (Durable Object + Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker to Cloudflare (api.throwmyfile.com)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8846c8d2c9e982da3cee1c655ff8cb7c
