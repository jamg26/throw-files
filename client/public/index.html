<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Share your files wherever you are." />

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ED4B9E" />
        <meta name="msapplication-TileColor" content="#ed4b9e" />
        <meta name="theme-color" content="#ed4b9e" />

        <!-- Primary Meta Tags -->
        <title>ThrowMyFile</title>
        <meta name="title" content="ThrowMyFile" />
        <meta name="description" content="Share your files wherever you are." />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://throwmyfile.com/" />
        <meta property="og:title" content="ThrowMyFile" />
        <meta property="og:description" content="Share your files wherever you are." />
        <meta property="og:image" content="https://throwmyfile.com/og_image.png" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://throwmyfile.com/" />
        <meta property="twitter:title" content="ThrowMyFile" />
        <meta property="twitter:description" content="Share your files wherever you are." />
        <meta property="twitter:image" content="https://throwmyfile.com/og_image.png" />
        
        <link rel="manifest" href="/manifest.json" />
        
        <style type="text/css">
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }
            .navbar {
                background-color: #4169e1;
            }
            .navbar h3 {
                display: inline-block;
                text-align: left;
                padding: 10px;
                color: black;
                text-decoration: none;
            }
            .navbar a {
                display: inline-block;
                padding: 10px;
                color: #fff;
                text-decoration: none;
            }
            .page-info {
                padding: 10px;
            }
            .Current {
                color: #2e8b57;
            }
            .Completed {
                color: #ff6347;
                text-decoration: line-through;
            }
        </style>
        
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker
                        .register('worker.js')
                        .then(
                            function (registration) {
                                console.log('Worker registration successful', registration.scope);
                            },
                            function (err) {
                                console.log('Worker registration failed', err);
                            }
                        )
                        .catch(function (err) {
                            console.log(err);
                        });
                });
            } else {
                console.log('Service Worker is not supported by browser.');
            }
        </script>
    </body>
</html>
